site_name: omnisus
site_description: Dados públicos de saúde do Brasil (DATASUS, IBGE, CNES) num lake no computador, no Google Drive ou na nuvem, com procedência para citar
site_url: https://raphaelfh.github.io/omnisus/
repo_url: https://github.com/raphaelfh/omnisus
repo_name: raphaelfh/omnisus
edit_uri: edit/main/docs/
copyright: "(c) 2026 Raphael Federicci · MIT"
hooks:
  - scripts/mkdocs_hooks.py

# Contributor-only pages: read in the repository, not published on the site.
exclude_docs: |
  agents/

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro

nav:
  - Início: index.md
  - Pesquisa:
      - Comece aqui: pesquisa/index.md
      - De onde vem cada rótulo: dicionario/index.md
      - Bases:
          - SIM · óbitos: sources/sim_obitos.md
          - SINASC · nascidos vivos: sources/sinasc_nascidos_vivos.md
          - SIH · AIH reduzida: sources/sih_aih_reduzida.md
          - SIA · produção ambulatorial: sources/sia.md
          - CNES · estabelecimentos: sources/cnes_estabelecimentos.md
          - IBGE · população: sources/ibge_populacao.md
          - SINAN · Chagas aguda: sources/sinan_chagas.md
          - SINAN · hanseníase: sources/sinan_hanseniase.md
          - SINAN · tuberculose: sources/sinan_tuberculose.md
          - Medicamentos: sources/medicamentos.md
          - Vocabulários e SIGTAP: sources/vocabularios.md
      - Indicadores: pesquisa/indicadores.md
      - Reprodutibilidade: pesquisa/reprodutibilidade.md
  - Guias:
      - Getting Started: guides/getting-started.md
      - Knowing what exists: guides/inventory.md
      - Reprocessing and maintenance: guides/reprocessing-and-maintenance.md
  - Referência:
      - Bases e argumentos: datasets.md
      - API: api.md
      - Contrato por coluna: dicionario/contrato.md
      - Consumo dos metadados: dicionario/consumo.md
  - Contribuir:
      - Como contribuir: contributing.md
      - Manutenção dos dicionários: dicionario/manutencao.md
      - Architecture: architecture.md
      - Decisões:
          - 0001 Rust DBF: decisions/0001-rust-dbf.md
          - 0002 Registry as catalog: decisions/0002-registry-as-catalog.md
          - 0003 Harmonised categories: decisions/0003-harmonised-categories-only-for-validated-sources.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search:
      lang: [pt, en]
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
