name: docs

# The site describes the omnisus on PyPI, so only a release tag deploys it
# (RELEASE.md). Dispatch on a tag redeploys that release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Build (without deploying) on PRs, so a docs break is caught before merge.
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync --frozen --extra docs
        # --strict turns broken links into failures.
      - run: uv run mkdocs build --strict
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  # Only a v* tag may deploy: the github-pages environment needs a deployment
  # rule for v* tags and rejects other refs, so the environment lives on this
  # tag-only job instead of on the build.
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
