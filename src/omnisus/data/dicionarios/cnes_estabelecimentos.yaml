name: cnes_estabelecimentos
title: CNES — Estabelecimentos (ST)
profile: tabular-data-resource
# latin-1 define os 256 bytes; cp1252 deixa 0x81, 0x8D, 0x8F, 0x90 e 0x9D sem
# caractere e derrubava a importação inteira (RDSP2308 AUD_JUST 0x90,
# STSP2212 ALVARA 0x8F). value.encode("latin-1") devolve os bytes do arquivo.
encoding: latin-1
description: |
  Cadastro Nacional de Estabelecimentos de Saúde (CNES) — arquivo ST.
  Os arquivos públicos CNES-ST do DATASUS NÃO carregam o nome do
  estabelecimento (RAZAO_SOCIAL/NOMEFANT) — esses campos foram retirados na
  anonimização. Para obter o nome, é necessário a API CNES
  (``cnes.datasus.gov.br/services/estabelecimentos/{cnes}``), que é outro
  pipeline. Este YAML reflete apenas o que o DBF público carrega.
schema:
  fields:
    - name: cnes
      type: string
      label: CNES
      description: "Código CNES (7 dígitos)"
      constraints: { required: true }
    - name: codufmun
      type: string
      label: Município (IBGE)
      x-normalization-hint: lpad_6
      foreignKeys:
        - { fields: codufmun, reference: { resource: aux_municipios, fields: codigo_6 } }
    - name: cnpj_man
      type: string
      label: CNPJ da mantenedora
    - name: tp_unid
      type: string
      label: Tipo de unidade
      x-decode:
        '01': POSTO DE SAUDE
        '02': CENTRO DE SAUDE/UNIDADE BASICA
