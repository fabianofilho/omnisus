      type: string
      label: Ap coidade
      x-decode:
        '2': Dias
        '3': Meses
        '4': Anos
      x-metadata:
        issues:
        - id: ap_coidade-sem-tabela
          status: open
          description: '''5'' fica sem rótulo, e ''2'', ''3'' e ''4'' foram medidos, não lidos: nenhuma tabela
            rotula o código de 1 caractere. IDADEDET.CNV e IDADE18.CNV (TAB_SIA), ligados a AP_COIDADE em
            todos os DEF de APAC, leem 3 caracteres, AP_COIDADE seguido de AP_NUIDADE: ''000'' é ''Idade inválida''
            e 500 a 530 são 100 a 130 anos. O Informe Técnico SIASUS 2019-07 descreve AP_COIDADE (CHAR 1,
            ''Código da Idade'') sem códigos (pp. 6-14). SP 2022: ''5'' em 12 linhas (relatório 2026-09-23-linkage-ampliado).'
    - name: ap_nuidade
      type: string
      label: Idade (na unidade de ap_coidade)
    - name: ap_sexo
      type: string
      label: Ap sexo
      x-decode:
        ? ''
        : Não exigido
        '0': Não exigido
        F: Feminino
        M: Masculino
      x-metadata:
