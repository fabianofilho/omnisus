        1C: RAÇA/COR  (OUTROS INDEVIDOS)
        1G: RAÇA/COR  (OUTROS INDEVIDOS)
        1M: RAÇA/COR  (OUTROS INDEVIDOS)
        '87': RAÇA/COR  (OUTROS INDEVIDOS)
        '99': SEM INFORMAÇÃO
        DE: RAÇA/COR  (OUTROS INDEVIDOS)
