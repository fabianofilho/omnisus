# Identidade do arquivo: dt_process vale 202401 nos 1.670 registros de PSRR2401 e ufmun
# começa por 14 (RR) em todos; mesma regra do BPA-I.
x-identity:
  month_column: dt_process
  uf_column: ufmun

x-analytics:
  version: 1.0.0
  applicability_policy: exact_audited_source_identity
  validated_sources:
  - uf: RR
    ano: 2024
    mes: 1
    release: final
    source_sha256: 56022bfa7245e8d57530c74e7f3144ec797c14736e94e873ba25e0ffb5c2b5d7
  age:
    field: idadepac
    kind: sih
    unit_field: tpidadepac
    units:
      '2':
        unit: day
        minimum_value: 0
        maximum_value: 29
      '3':
        unit: month
        minimum_value: 1
        maximum_value: 11
      '4':
        unit: year
        minimum_value: 1
        maximum_value: 99
      '5':
        unit: year
        offset: 100
        minimum_value: 0
        maximum_value: 30
    maximum_value: 99
    invalid_composites:
    - '000'
    - '999'
    evidence:
    - source_id: sia-tab-e5812b51d802
      pages: []
      locator: 'RAAS_Psicossocial.def and Atencao_Domiciliar.def: XIdade detalhada, TPIDADEPAC, 1, CNV/IDADEDET.CNV; CNV/IDADEDET.CNV compares 3 characters'
    - source_id: siasus-70fe69dbd4cf
      pages: [15, 16, 17]
      locator: 'TPIDADEPAC CHAR (1) then IDADEPAC CHAR (2), with the same description in the SAD (p. 15), PS (p. 16) and BI (p. 17) layouts'
    notes:
    - Kind sih is the encoding, not the system - a unit code in its own field and a two-digit quantity, read as the 3 characters IDADEDET.CNV compares.
    - 000 and 999 are "Idade inválida" in IDADEDET.CNV. 230 ("1 mês") and 312 ("11 meses") are second codes of a category; this exact-quantity rule leaves them unsupported.
    - The DBF header of PSRR2401 puts IDADEPAC right after TPIDADEPAC (offsets 90 and 91).
    - Audit on 2026-09-23 - all 1,666 unit-4 rows of PSRR2401 equal the completed years from DTNASC to DT_INICIO.
