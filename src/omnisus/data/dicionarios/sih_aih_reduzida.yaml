            "NÃO INFORMADO" só pela faixa, publicado ou não. Nas fixtures, ''0000'' não
            quer dizer etnia desconhecida: marca AIH de paciente não indígena. RR
            2024-01: ''0000'' em 3.303 das 3.714 AIHs, todas com raca_cor 01-04, e as
            411 AIHs com raca_cor 05 têm código de 0001-0264; nos excertos SP (RDSP2201,
            RDSP2308), ''0000'' tem raca_cor 01 ou 02. Para contar pacientes indígenas,
            filtre por raca_cor.'
        - id: etnia-hifen-suave
          status: open
          description: 'etnia.cnv (TAB_SIH, f05b32f32908) escreve o byte 0xAD em 15 rótulos, que o
            latin-1 lê como U+00AD (hífen suave), invisível na tela: ''0001'', ''0011'',
            ''0016'', ''0032'', ''0099'', ''0128'', ''0161'', ''0171'', ''0186'',
            ''0204'', ''0226'', ''0231'', ''0255'', ''0256'', ''0257''. Os rótulos ficam
            como publicados, e uma busca por texto não os encontra: "XIRIANA" não acha o
            rótulo de ''0256'' nem o de ''0257'' (gravado XI, U+00AD, RIANA). RR
            2024-01: 111 das 411 AIHs com raca_cor 05.'
        - id: etnia-x389-x401-sem-fonte
          status: open
          description: 'RDRR2501 (RR, 2025-01; SHA-256 42301ab9..., em tests/fixtures/FIXTURES.md)
            publica ''X389'' em 2 AIHs e ''X401'' em 3, todas com raca_cor 05. Não são
            dígitos: ficam fora da faixa 0000-9999 do etnia.cnv e de qualquer linha
            dele, e sem rótulo; nenhuma outra fonte registrada os cita. O excerto
            sih_rd_rr_2025_01_excerpt traz as duas AIHs com ''X389''.'
