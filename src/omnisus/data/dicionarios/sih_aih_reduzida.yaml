name: sih_aih_reduzida
title: SIHSUS — AIH Reduzida (RD)
profile: tabular-data-resource
# latin-1 define os 256 bytes; cp1252 deixa 0x81, 0x8D, 0x8F, 0x90 e 0x9D sem
# caractere e derrubava a importação inteira (RDSP2308 AUD_JUST 0x90,
# STSP2212 ALVARA 0x8F). value.encode("latin-1") devolve os bytes do arquivo.
encoding: latin-1
