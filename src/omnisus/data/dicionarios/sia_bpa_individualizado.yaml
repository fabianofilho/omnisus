    - name: tippre
      type: string
      label: Tipo de prestador
    - name: mn_ind
      type: string
      label: Estabelecimento mantido / individual
      x-metadata:
        issues:
        - id: bpai-sem-def
          status: open
          description: 'Sem mapa: o TAB_SIA (e5812b51d802) não tem DEF do BPA-I; nenhum dos 12 DEF empacotados lê BI*.DBC. Atencao_Domiciliar.def (linhas 236-238, sad*.dbc) liga MN_IND a CNV/MANT_IND.CNV, o que não diz que o BPA-I segue essa tabela. O Informe Técnico SIASUS 2019-07 (p. 17, leiaute BIUFAAMM.DBF) traz "MN_IND CHAR (1) Estabelecimento Mantido / Individual". O mapa anterior, ''M'' Mantido e ''I'' Individual, foi escrito à mão (o MANT_IND.CNV diz ''Mantida''). BIRR2401: MN_IND ''I'' em 5.126 linhas e ''M'' em 6.973.'
