    - name: cnsprof
      type: string
      label: CNS do profissional
      description: "Não é cifrado: identifica o profissional e vem sem cifra no arquivo do DATASUS, ao contrário do CNS do paciente; as fixtures a deixam em branco (tests/fixtures/FIXTURES.md) e o lake a importa como publicada (#68)."
    - name: cboprof
      type: string
      label: CBO do profissional
    - name: cidpri
      type: string
      label: CID-10 principal (sem ponto)
    - name: catend
      type: string
      label: Caráter do atendimento
      x-metadata:
        issues:
        - id: bpai-sem-def
          status: open
          description: 'Sem mapa: o TAB_SIA (e5812b51d802) não tem DEF do BPA-I; nenhum dos 12 DEF empacotados lê BI*.DBC. RAAS_Psicossocial.def e Atencao_Domiciliar.def (linhas 40-42 de cada um, PS*.dbc e sad*.dbc) ligam CATEND a CNV/CARAT_AT.CNV, o que não diz que o BPA-I segue essa tabela. O Informe Técnico SIASUS 2019-07 (p. 17, leiaute BIUFAAMM.DBF) traz "CATEND CHAR (2) Caráter de Atendimento". O mapa anterior, ''01'' a ''06'', foi escrito à mão, com rótulos que não são os do CARAT_AT.CNV (''Acidente no trajeto'' onde o CNV diz ''ACIDENTE NO TRAJETO PARA O TRABALHO''), e ''06'' não aparece em nenhuma das quatro fixtures do BPA-I. BIRR2401: CATEND ''01'' em 10.311 linhas, ''02'' em 1.369, ''03'' em 417, ''04'' em 1 e ''05'' em 1.'
