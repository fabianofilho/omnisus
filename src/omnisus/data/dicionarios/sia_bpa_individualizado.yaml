    - name: tpidadepac
      type: string
      label: Unidade da idade
      x-decode:
        "2": "Dias"
        "3": "Meses"
        "4": "Anos"
        "5": "Anos (somar 100)"
      x-metadata:
        claims:
        - target: /field/codes
          value_sha256: 83616371dedaa6efde39e6aa288ca9c043d7a29fcef25633a2fa65a3d37952e0
          status: unreviewed
          checked_at: '2026-11-15'
          method: fixture-measure
          reviewer: null
          evidence:
          - source_id: sia-tab-e5812b51d802
            pages: []
            locator: 'RAAS_Psicossocial.def, linhas 50-51, e Atencao_Domiciliar.def, linhas 53-54: TPIDADEPAC, 1, CNV/IDADEDET.CNV e CNV/IDADE18.CNV (o TAB_SIA não traz DEF do BPA-I)'
          note: 'Medido, não lido (issue tpidadepac-sem-tabela). Os CNV leem 3 caracteres, TPIDADEPAC seguido de IDADEPAC; nenhuma tabela rotula o código de 1 caractere.'
        issues:
        - id: tpidadepac-sem-tabela
          status: open
          description: '''0'' e ''9'' ficam sem rótulo: o TAB_SIA não tem DEF do BPA-I, e
            IDADEDET.CNV (ligado a TPIDADEPAC em RAAS_Psicossocial.def e Atencao_Domiciliar.def)
            rotula só os 3 caracteres TPIDADEPAC seguido de IDADEPAC, nunca o código de 1 caractere.
            Essa leitura decodifica idadepac (derivação coded_age): ''000'' e ''999'' são "Idade
            inválida", ''5'' mais 00 a 30 são 100 a 130 anos. ''2'', ''3'', ''4'' e ''5'' foram medidos (BIAC2401: 4 concorda com DTNASC em 99,2%), não lidos numa fonte; ''5'' é ''Anos (somar 100)'', como 500 a 530 no IDADEDET.CNV. BI RR 2022: ''5'' com
            IDADEPAC 00-29 e nascimento 1892-1922, ''9'' sempre com 99, ''0'' com 00 em BIRR2205 e
            BIRR2211 (nascimentos 1192 e 1892).'
