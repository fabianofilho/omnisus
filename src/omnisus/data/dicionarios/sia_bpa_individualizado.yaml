          note: O TAB_SIA não tem DEF do BPA-I. O mapa é o de PA_TPFIN (sia_producao_ambulatorial),
            que o Informe Técnico descreve com as mesmas palavras que TPFIN do BPA-I. O mapa anterior
            dizia '07' Incentivos.
    - name: subfin
      type: string
      label: Subtipo de financiamento
    - name: complex
      type: string
      label: Complexidade
      x-metadata:
        issues:
        - id: bpai-sem-def
          status: open
          description: 'Sem mapa: o TAB_SIA (e5812b51d802) não tem DEF do BPA-I; nenhum dos 12 DEF empacotados lê BI*.DBC. Nenhum deles cita COMPLEX como campo: Producao_Ambulatorial.DEF (linhas 89-91, PA*.DBC) liga PA_NIVCPL a CNV/COMPLEX.CNV, o que não diz que o BPA-I segue essa tabela. O Informe Técnico SIASUS 2019-07 (p. 17, leiaute BIUFAAMM.DBF) traz "COMPLEX CHAR (1) Complexidade do Procedimento". O mapa anterior, ''0'' Não se aplica, ''1'' Atenção Básica, ''2'' Média complexidade e ''3'' Alta complexidade, foi escrito à mão (o COMPLEX.CNV traz ''0-Não se Aplica''). BIRR2401: COMPLEX ''0'' em 699 linhas, ''1'' em 468, ''2'' em 8.721 e ''3'' em 2.211.'
