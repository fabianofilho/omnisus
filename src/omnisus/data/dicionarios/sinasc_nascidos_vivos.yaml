x-analytics:
  version: 1.0.0
  applicability_policy: exact_audited_source_identity
  validated_sources:
  - ano: 2023
    uf: RR
    release: final
    source_sha256: 3b9c5cb07b3981e735bea9bc9c7967906af13047b202cc85550b92c885e82a3c
  age:
    field: idademae
    subject: mother
    kind: years
    units:
      year:
        unit: year
        minimum_value: 1
        maximum_value: 65
    ignored_values: ['0', '00', '99']
    evidence:
    - source_id: sinasc-24e0d4388ea1
      pages: [1]
      locator: IDADEMAE, C(02), idade da mãe em anos
    - source_id: sinasc-manual-b88f538902ee
      pages: [16]
      locator: Campo 19, anos completos da mãe no momento do parto
    - source_id: sinasc-tab-ff0124f6aecf
      pages: []
      locator: NASCIDO.def; IDADEMAE.CNV and IDADET.CNV
    notes:
    - The subject is the mother; SEXO refers to the newborn and is not a maternal sex rule.
    - 00 and 99 belong to the ignored tabulation group in both CNVs; this is not a claim about collection sentinels.
    - 01-65 is the common supported range. 66-70 conflicts between CNVs; other quantities remain unsupported.
    - The audit covers the complete final DNRR2023.dbc collected from SINASC/1996_/Dados/DNRES.
  dates: []
