name: sih_aih_reduzida_1992_1997
title: "SIHSUS: AIH reduzida (RD), 1992-01 a 1997-12"
profile: tabular-data-resource
encoding: latin-1
x-version: 1.1.0
x-source-format: dbc
x-evidence:
  physical_schema: >-
    43 fields: the union of the 7 DBF layouts of the files read on 2026-10-01 from 1992-01 to
    1997-12 (96 files: one RR file a month, AP where RR is missing, and SP and MG in the
    months a layout changes; evidence/2026-10-01-rd-1992-2007-layouts/). Each is in
    sih_rd_rr_1994_12_mini.dbc or sih_rd_rr_1997_09_mini.dbc. num_proc is C4 from 1995-01 and
    N4 from 1996-01 to 1996-07; the dictionary types it string and staging writes the N form
    as text, without zero padding (issue #40). The era is split from 1998-01 (issue #12, decision 1): the dictionary of
    1998-01 to 2007-12 is sih_aih_reduzida_1998_2007.
  semantic_status: >-
    Physical inventory; individual semantic fields not audited. The code maps of ident,
    sexo, morte, natureza and semiplen come from the CNV that RD.DEF binds in the three era
    packages, byte-identical (evidence/2026-09-29-tab-sih-rd-eras/).
  dictionary_url: ftp://ftp.datasus.gov.br/dissemin/publicos/SIHSUS/199201_200712/Doc/
  source_url: ftp://ftp.datasus.gov.br/dissemin/publicos/SIHSUS/199201_200712/Dados/RDRR9709.dbc
