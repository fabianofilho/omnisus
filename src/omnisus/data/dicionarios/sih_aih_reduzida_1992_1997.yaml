          (evidence/2026-10-01-rd-1992-2007-layouts/census.csv) dá DIAG_PRINC C6 em todos
          os arquivos de 1992-01 a 1997-12, e todo valor de sih_rd_rr_1994_12_mini e
          sih_rd_rr_1997_09_mini tem 6 algarismos. O RD.DEF dos três pacotes da era liga
          DIAG_PRINC às tabelas das duas classificações (sih_199201_199712/RD.DEF: CID-10
          nas linhas 280-341, CID-9 nas 348-393), e o pacote não traz tabela da CID-9. O
          código não junta à aux_cid10, nem um filtro como LIKE 'I21%' o acha; de
          1998-01 em diante, a coluna grava CID-10 em sih_aih_reduzida_1998_2007.
