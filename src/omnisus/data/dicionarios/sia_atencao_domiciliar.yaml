# Identidade do arquivo: dt_process vale 201810 e ufmun começa por 21 (MA) nos 33
# registros de SADMA1810; mesma regra do BPA-I e da PS.
x-identity:
  month_column: dt_process
  uf_column: ufmun

x-analytics:
  version: 1.0.0
  applicability_policy: exact_audited_source_identity
  validated_sources:
  - uf: MA
    ano: 2018
    mes: 10
    release: final
    source_sha256: 09470713cd7e913e690d5c98df63d12282c26c48db241ddc629d293911182f89
  age:
    field: idadepac
    kind: sih
    unit_field: tpidadepac
    units:
      '2':
        unit: day
        minimum_value: 0
        maximum_value: 29
      '3':
        unit: month
        minimum_value: 1
        maximum_value: 11
      '4':
        unit: year
        minimum_value: 1
        maximum_value: 99
      '5':
        unit: year
        offset: 100
        minimum_value: 0
        maximum_value: 30
    maximum_value: 99
    invalid_composites:
    - '000'
    - '999'
    evidence:
    - source_id: sia-tab-e5812b51d802
      pages: []
      locator: 'Atencao_Domiciliar.def: XIdade detalhada, TPIDADEPAC, 1, CNV/IDADEDET.CNV; CNV/IDADEDET.CNV compares 3 characters'
    - source_id: siasus-70fe69dbd4cf
      pages: [15]
      locator: 'SAD layout: TPIDADEPAC CHAR (1) then IDADEPAC CHAR (2)'
    notes:
    - Kind sih is the encoding, not the system - a unit code in its own field and a two-digit quantity, read as the 3 characters IDADEDET.CNV compares.
    - 000 and 999 are "Idade inválida" in IDADEDET.CNV. 230 ("1 mês") and 312 ("11 meses") are second codes of a category; this exact-quantity rule leaves them unsupported.
    - The DBF header of SADMA1810 puts IDADEPAC right after TPIDADEPAC (offsets 88 and 89).
    - Audit on 2026-09-23 - all 33 rows of SADMA1810 (unit 4) equal the completed years from DTNASC to DT_INICIO.
