name: sia_apac_cirurgia_bariatrica
title: SIASUS — APAC de Acompanhamento Pós-Cirurgia Bariátrica (ABO)
profile: tabular-data-resource
# ABO e o acompanhamento pos-cirurgia: o TAB_SIA.zip le ABO*.DBF com
# APAC_Pos_Cirurgia_Bariatica.def, e AP_PRIPAL e 0301120056 (SIGTAP). O nome
# sia_apac_cirurgia_bariatrica fica por compatibilidade; so o titulo mudou.
# Gerado do header DBF REAL (ABOSP2401.dbf), nao do informe tecnico.
# latin-1 obrigatorio: cifra do CNS usa 0x7B-0x84 (0x81 quebra cp1252).
# NOTA: o header real tem 86 campos; 8 sem nome sao
# descartados pelo dbfread2 e ficam fora do dicionario.
encoding: latin-1
x-version: "0.2.0"
