[project]
name = "omnisus"
dynamic = ["version"]
description = "Python library for ingesting Brazilian public health databases into DuckLake"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Raphael Federicci", email = "rfh.federicci@gmail.com" }]
readme = "README.md"
keywords = ["datasus", "duckdb", "ducklake", "polars", "brazil", "health", "epidemiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "duckdb>=1.5.5,<2.0",
    "polars>=1.44.2,<2.0",
    "pyarrow>=25.0.1",
    "dbfread2>=0.1.0,<2.0",
    "typer>=0.27.2",
    "rich>=13.8.0",
    "structlog>=26.1.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    # Windows has no system time-zone database; pyarrow needs it to convert the
    # TIMESTAMPTZ columns that expire_snapshots and cleanup_files return.
    "tzdata>=2026.3; sys_platform == 'win32'",
    # Rust DBF reader and DBC decompressor, on the platforms with a published
    # wheel; elsewhere the Python decoders run (ADR 0001).
    "omnisus-dbf>=0.2.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.5",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.168.0",
    "respx>=0.23.1",
    # Validates every packaged dictionary (tests/unit/transforms/test_frictionless_schemas.py).
    "frictionless>=5.19.0",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "types-PyYAML>=6.0.12.20260906",
    "pre-commit>=4.6.2",
    # The notebook tests import marimo; keep one pin, in the notebooks extra.
    "omnisus[notebooks]",
]
docs = [
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
notebooks = [
    "marimo>=0.25.0,<0.26",
    # marimo parses mo.sql cells with sqlglot; no library code imports it.
    "sqlglot>=30.18.0",
]

[project.scripts]
omnisus = "omnisus.cli.main:app"

[project.urls]
Homepage = "https://github.com/raphaelfh/omnisus"
Documentation = "https://raphaelfh.github.io/omnisus"
Repository = "https://github.com/raphaelfh/omnisus"

[build-system]
requires = ["hatchling>=1.32.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version has one home: _version.py.
path = "src/omnisus/_version.py"

# Without this list hatch packs the whole checkout (evidence, notebooks,
# fixtures) into the sdist.
[tool.hatch.build.targets.sdist]
only-include = ["src/omnisus", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/omnisus"]

[tool.hatch.build.targets.wheel.force-include]
"src/omnisus/data/auxiliares-bootstrap.zip" = "omnisus/data/auxiliares-bootstrap.zip"

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# marimo displays final expressions and injects imported classes as cell arguments.
"notebooks/**/*.py" = ["B018", "N803", "N806"]
# Archived evidence scripts import the package under its old name, omnisus_db,
# which isort no longer knows as first-party. They stay byte-for-byte as recorded.
"evidence/**/*.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
# Ruff 0.16 includes Markdown by default. Keep the existing Python-only
# formatting scope; historical design documents contain illustrative snippets.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "bench_*.py"]
asyncio_mode = "auto"
markers = [
    "rust_dbf: requires the optional native DBF extension",
    "integration: tests that hit external resources or real lake",
    "e2e: full-stack end-to-end tests (slow, manual/cron)",
    "perf: performance benchmarks",
]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
